<audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>
<button id="musicToggle" class="mc-music-btn" type="button" aria-label="Toggle background music">

    <span class="mc-note">♪</span>

    <span class="mc-label">
        <span class="mc-small">MUSIC</span>

<style>
.mc-music-btn {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 99999;

    width: 150px;
    height: 58px;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 6px 12px;

    border: 3px solid #181818;
    border-radius: 3px;

    /* Minecraft-style dirt block */
    background:
        linear-gradient(
            to bottom,
            #5b3a20 0px,
            #5b3a20 7px,
            #754b28 7px,
            #754b28 100%
        );

    color: white;

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    cursor: pointer;

    box-shadow:
        inset 3px 3px 0 rgba(255,255,255,.12),
        inset -3px -3px 0 rgba(0,0,0,.35),
        4px 5px 0 #111,
        0 8px 18px rgba(0,0,0,.25);

    transition:
        transform .08s linear,
        box-shadow .08s linear,
        filter .08s linear;
}

/* Minecraft grass strip */
.mc-music-btn::before {
    content: "";
    position: absolute;

    top: -3px;
    left: -3px;
    right: -3px;

    height: 10px;

    background:
        linear-gradient(
            to bottom,
            #75b63b 0%,
            #5b922f 100%
        );

    border: 3px solid #181818;
    border-bottom: 2px solid #365d1d;

    border-radius: 3px 3px 0 0;
}

/* Pixel corners */
.mc-music-btn::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08);
}

/* =========================================
   MUSIC NOTE
   ========================================= */

.mc-note {
    position: relative;
    z-index: 2;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-top: 5px;

    background: #242424;

    border: 3px solid #111;

    color: #ffffff;

    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: bold;

    line-height: 1;

    box-shadow:
        inset 2px 2px 0 rgba(255,255,255,.12),
        inset -2px -2px 0 rgba(0,0,0,.5);
}

/* =========================================
   TEXT
   ========================================= */

.mc-label {
    position: relative;
    z-index: 2;

    display: flex;
    flex-direction: column;

    margin-top: 5px;

    text-align: left;
}

.mc-small {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 2px;

    color: #d8d8d8;
}

#musicText {
    margin-top: 1px;

    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;

    text-shadow:
        2px 2px 0 #111;
}

/* =========================================
   HOVER
   ========================================= */

@media (hover: hover) and (pointer: fine) {

    .mc-music-btn:hover {
        filter: brightness(1.12);

        transform: translateY(-2px);

        box-shadow:
            inset 3px 3px 0 rgba(255,255,255,.12),
            inset -3px -3px 0 rgba(0,0,0,.35),
            4px 7px 0 #111,
            0 12px 22px rgba(0,0,0,.3);
    }
}

/* =========================================
   CLICK / PRESSED
   ========================================= */

.mc-music-btn:active {
    transform: translateY(4px);

    box-shadow:
        inset 3px 3px 0 rgba(0,0,0,.3),
        inset -2px -2px 0 rgba(255,255,255,.08),
        1px 2px 0 #111;
}

/* =========================================
   PLAYING STATE
   ========================================= */

.mc-music-btn.playing {
    background:
        linear-gradient(
            to bottom,
            #5b3a20 0px,
            #5b3a20 7px,
            #80532c 7px,
            #80532c 100%
        );
}

.mc-music-btn.playing .mc-note {
    animation: mcMusicBounce .7s steps(2, end) infinite;
}

@keyframes mcMusicBounce {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-3px);
    }

    100% {
        transform: translateY(0);
    }
}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

    .mc-music-btn {
        left: 14px;
        bottom: 14px;

        width: 54px;
        height: 54px;

        padding: 5px;

        justify-content: center;

        border-width: 3px;
    }

    .mc-note {
        width: 38px;
        height: 38px;

        margin-top: 4px;
    }

    .mc-label {
        display: none;
    }
}
</style>


<script>
/* =========================================
   MUSIC CONTROLLER
   ========================================= */

const music = document.getElementById("bgMusic");
const musicToggle = document.getElementById("musicToggle");
const musicText = document.getElementById("musicText");

music.volume = 0.70;


/* Update button */
function updateMusicButton() {

    if (music.paused) {

        musicText.textContent = "OFF";

        musicToggle.classList.remove("playing");

    } else {

        musicText.textContent = "ON";

        musicToggle.classList.add("playing");
    }
}


/* Try autoplay immediately */
music.play()
    .then(() => {
        updateMusicButton();
    })
    .catch(() => {
        updateMusicButton();
    });


/* Button control */
musicToggle.addEventListener("click", function () {

    if (music.paused) {

        music.play()
            .then(() => {
                updateMusicButton();
            })
            .catch(() => {
                updateMusicButton();
            });

    } else {

        music.pause();

        updateMusicButton();
    }

});
</script>
